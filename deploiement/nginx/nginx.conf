upstream django {
    server backend:8000;
}

upstream angular {
    server frontend:80;
}

server {
    listen 80;
    # Répond quelle que soit l'adresse du serveur (IP ou nom)
    server_name _;

    client_max_body_size 50M;

    # Fichiers envoyés (documents, photos) : servis par nginx (Django ne les
    # sert pas hors mode debug)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    # Fichiers statiques Django (administration)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API Django
    location /api/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Administration Django
    location /django-admin/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Interface Angular (tout le reste)
    location / {
        proxy_pass         http://angular;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }
}
